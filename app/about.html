<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>À propos d'Anima</title><link rel="stylesheet" href="app.css"></head>
<body>
  <div class="center">
    <img class="logo" src="logo.svg" alt="">
    <h1>Anima</h1>
    <div id="version" class="small">Version …</div>
    <a id="repo" href="#" class="small" style="margin-top:8px">github.com/AnimaLab/Anima</a>
    <div class="small muted" style="margin-top:8px">Licence MIT</div>
  </div>
  <script>
    const { invoke } = window.__TAURI__.core;
    invoke('app_info').then((i) => {
      document.getElementById('version').textContent = `Version ${i.version ?? '?'}`;
      document.getElementById('repo').textContent = i.repo.replace('https://', '');
      document.getElementById('repo').onclick = (e) => { e.preventDefault(); invoke('open_url', { url: i.repo }); };
    });
  </script>
</body>
</html>
